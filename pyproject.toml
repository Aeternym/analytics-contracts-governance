[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "analytics-contracts-governance"
version = "0.1.0"
description = "Synthetic portfolio demo for analytics-contract governance"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
contracts-validate = "contracts_governance.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

